# Navegação: a partir da landing, abre a tela de Profile.
---
name: Navigate to Profile
appId: host.exp.exponent

---
- openLink: "exp://10.0.2.2:8081"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 120000
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "No profile yet"
    timeout: 60000
