# Navegação: a partir da landing, abre a tela de Fights e depois volta.
---
name: Navigate to Fights
appId: host.exp.exponent

---
- openLink: "exp://10.0.2.2:8081"
- extendedWaitUntil:
    visible: "Fights"
    timeout: 120000
- tapOn: "Fights"
- extendedWaitUntil:
    visible: "Your fights"
    timeout: 60000
