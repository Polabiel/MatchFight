name: Expo E2E (Maestro)

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3

jobs:
  maestro-android:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Emulador + todos os steps que dependem dele dentro do `script:`
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          script: |
            set -eu

            # cd para o app Expo
            cd apps/expo

            # Instalar Expo Go APK (via GitHub Releases oficial - Expo-Go-54.0.8 para SDK 54)
            wget -q --header="Accept: application/octet-stream" "https://github.com/expo/expo-go-releases/releases/download/Expo-Go-54.0.8/Expo-Go-54.0.8.apk" -O /tmp/expo-go.apk
            adb install -r /tmp/expo-go.apk

            # Iniciar Metro bundler em background (para o app mobile, não web)
            npx expo start --non-interactive &
            npx wait-on tcp:8081 --timeout=120000

            # Instalar Maestro CLI
            curl -fsSL "https://get.maestro.mobile.dev" | bash

            # Rodar testes Maestro
            ~/.maestro/bin/maestro test .maestro --config .maestro/config.yaml

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-screenshots
          path: apps/expo/.maestro/screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-videos
          path: apps/expo/.maestro/videos
          if-no-files-found: ignore