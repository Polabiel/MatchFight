name: Expo E2E (Maestro)

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3

jobs:
  maestro-android:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Emulador + todos os steps que dependem dele dentro do `script:`
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          # Executa o script E2E (arquivo commitado no repo).
          # A action executa o `script:` como sh -c linha a linha, então
          # toda a lógica fica num único script standalone chamado aqui.
          script: bash apps/expo/scripts/e2e-android.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-screenshots
          path: apps/expo/.maestro/screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-videos
          path: apps/expo/.maestro/videos
          if-no-files-found: ignore