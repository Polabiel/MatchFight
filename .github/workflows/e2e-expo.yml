name: Expo E2E (Maestro)

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3

jobs:
  maestro-android:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Emulador + todos os steps que dependem dele dentro do `script:`
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          script: |
            cat > /tmp/e2e-run.sh << 'ENDSCRIPT'
            #!/bin/bash
            set -eu

            cd apps/expo

            # Instalar Expo Go APK (via GitHub Releases oficial - Expo-Go-54.0.8 para SDK 54)
            wget -q --header="Accept: application/octet-stream" "https://github.com/expo/expo-go-releases/releases/download/Expo-Go-54.0.8/Expo-Go-54.0.8.apk" -O /tmp/expo-go.apk
            adb install -r /tmp/expo-go.apk

            # Iniciar Metro bundler em background (expo local do monorepo via pnpm)
            pnpm exec expo start --port 8081 --host 0.0.0.0 --non-interactive > /tmp/metro.log 2>&1 &
            METRO_PID=$!

            # Poll do status do Metro
            for i in $(seq 1 60); do
              if curl -sf "http://127.0.0.1:8081/status" > /dev/null 2>&1; then
                echo "Metro bundler ready after ${i}x2s"
                break
              fi
              if ! kill -0 $METRO_PID 2>/dev/null; then
                echo "Metro bundler process died. Log:"
                cat /tmp/metro.log
                exit 1
              fi
              sleep 2
            done

            if ! curl -sf "http://127.0.0.1:8081/status" > /dev/null 2>&1; then
              echo "Metro bundler failed to start. Log:"
              cat /tmp/metro.log
              exit 1
            fi

            # Instalar Maestro CLI
            curl -fsSL "https://get.maestro.mobile.dev" | bash

            # Rodar testes Maestro
            ~/.maestro/bin/maestro test .maestro --config .maestro/config.yaml

            # Cleanup
            kill $METRO_PID 2>/dev/null || true
            ENDSCRIPT
            chmod +x /tmp/e2e-run.sh
            bash /tmp/e2e-run.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-screenshots
          path: apps/expo/.maestro/screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-videos
          path: apps/expo/.maestro/videos
          if-no-files-found: ignore