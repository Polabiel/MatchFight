services:
  db:
    image: postgres:16-alpine
    container_name: matchfight-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: matchfight
    ports:
      - "55432:5432"
    volumes:
      - matchfight-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matchfight"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  matchfight-db-data:
